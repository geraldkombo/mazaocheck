name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html exists and all referenced files exist
        run: |
          python3 - <<'EOF'
          import os, re, sys
          bad = []
          if not os.path.exists("index.html"):
              bad.append("index.html is missing")
          else:
              html = open("index.html", encoding="utf-8").read()
              for r in re.findall(r'(?:src|href)="([^"]+)"', html):
                  if r.startswith(("http://", "https://", "//", "mailto:", "#", "data:")):
                      continue
                  p = r.split("?")[0].split("#")[0]
                  if p and not os.path.exists(p):
                      bad.append("index.html -> " + p)
          readme = open("README.md", encoding="utf-8").read()
          for m in re.findall(r'`([^`]+\.(?:html|svg|json|md|yml|yaml))`', readme):
              if not os.path.exists(m):
                  bad.append("README.md -> " + m)
          if bad:
              print("BROKEN REFERENCES:")
              for b in bad:
                  print(" -", b)
              sys.exit(1)
          print("OK: index.html present; all relative refs and README file mentions exist")
          EOF
